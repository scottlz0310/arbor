coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 2%

# Thin #[tauri::command] wrappers and the AppHandle / updater plugin glue only. Kept in sync with the cargo llvm-cov step in ci.yml and checked by src-tauri/src/ipc/guard.rs.
# ASCII only: the Codecov CLI on Windows reads this file as cp1252.
ignore:
  - "src-tauri/src/ipc/**"
  - "src-tauri/src/commands/updater_tauri.rs"

flag_management:
  default_rules:
    carryforward: true

flags:
  frontend:
    paths:
      # Keep in sync with bunfig.toml and coverage-manifest.test.ts. ASCII only: the Codecov CLI on Windows reads this file as cp1252.
      - src/lib/
      - src/components/
      - src/views/
    carryforward: true
  rust:
    paths:
      - src-tauri/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
