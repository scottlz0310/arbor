[install]
linker = "isolated"
# 公開から 3 日未満の版を新規に解決しない（Renovate の minimumReleaseAge と同じ水準）。
# lock file maintenance は Renovate 側で minimumReleaseAge が無効のため、無人の自動マージではこの設定が防御になる。
# lockfile どおりに再現する frozen install には影響しない。
minimumReleaseAge = 259200

[test]
root = "src"
preload = ["./src/test/happydom.ts", "./src/test/setup.ts"]
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# vitest の coverage.include (lib / components / views) と揃えるための除外リスト
coveragePathIgnorePatterns = [
  "src/App.tsx",
  "src/main.tsx",
  "src/stores/**",
  "src/styles/**",
  "src/test/**",
  "src/types/**",
]
