name: Package MSIX

# Windows 版の MSIX と .appinstaller を作る（検証用）。リリースの配布物は、release.yml が、同じ部品（build-exe.yml と
# .github/actions/package-msix-signed）で作る。
#   - workflow_dispatch: 手動で実行して、署名済みの MSIX（artifact `arbor-msix`）を実機に入れて確認する。タグは、MSIX の版に
#     だけ使う（リリースではないので、実在しなくてよい）。ワークフローが main にあるときだけ起動できる。
#     `ref` を指定すると、そのコミットから arbor.exe を作る（リリースの復旧で、リリースのコミットから作り直すとき）。
#     MSIX のマニフェスト・ロゴ・スクリプトは、このワークフローのコミット（main）のものを使う。
#   - pull_request: MSIX に関わる変更で、未署名のパッケージ化だけを検証する（マニフェストの不備を、リリースの前に見つける）。
#
# 署名用の Secrets（SIGNING_CERTIFICATE_BASE64 / _PASSWORD）は、リポジトリの Secrets ではなく、Environment
# `msix-signing` のシークレットに置く。この Environment は、main からのデプロイだけを許す。同一リポジトリの PR は、
# ワークフロー自体を書き換えて、リポジトリの Secrets を読めるため、署名のジョブ（environment あり）を、PR では
# 動かさず、PR のジョブ（environment なし）には、署名用の Secrets を展開しない。
# **署名のジョブは、再利用ワークフロー（workflow_call）の中に置かない。** 再利用ワークフローの中では、Environment のシークレットが
# `secrets` に渡らない（v0.4.0 のリリースで、署名のジョブが、空のシークレットで失敗した）。
# これらの規則は、tests/PackageMsixWorkflow.Tests.ps1 と tests/WorkflowSecrets.Tests.ps1 が検査する。
# Environment の作成と登録は、packaging/msix/Register-SigningSecrets.ps1 と New-SigningCertificate.ps1。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "MSIX の版にするタグ（例: v0.4.0。実在しなくてよい）"
        required: true
        default: "v0.0.0"
        type: string
      ref:
        description: "arbor.exe を作るコミット（空なら、このワークフローのコミット）"
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - "packaging/msix/**"
      - "scripts/install.ps1"
      - "scripts/Test-ReleaseMsix.ps1"
      - "src-tauri/icons/**"
      - ".github/workflows/package-msix.yml"
      - ".github/workflows/build-exe.yml"
      - ".github/actions/package-msix-signed/**"

permissions:
  contents: read

jobs:
  # ── 1. arbor.exe を作る（Secrets は使わない。PR でも動く） ───────────────────────
  build:
    uses: ./.github/workflows/build-exe.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # ── 2a. PR: 未署名でパッケージ化だけを検証する（environment なし。署名用の Secrets は展開しない） ──
  package-unsigned:
    name: MSIX Package (unsigned)
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download arbor.exe
        uses: actions/download-artifact@v8
        with:
          name: arbor-exe
          path: ${{ runner.temp }}/bin

      - name: Build MSIX (unsigned)
        shell: pwsh
        run: |
          # 署名用のパスワードが、このジョブに渡っていないことを、実行時にも確かめる
          if ($env:SIGNING_CERTIFICATE_PASSWORD) { throw "未署名のビルドに、署名用のパスワードが渡っています" }
          ./packaging/msix/Build-Msix.ps1 -BinaryPath "$env:RUNNER_TEMP\bin\arbor.exe" -Tag $env:TAG -OutDir "$env:RUNNER_TEMP\msix"

      - name: Add installer script
        shell: pwsh
        run: Copy-Item -LiteralPath "scripts/install.ps1" -Destination "$env:RUNNER_TEMP\msix\install.ps1"

      - name: Record checksums
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\msix"
          $lines = foreach ($name in "arbor_x64.msix", "arbor.appinstaller", "install.ps1") {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash.ToLowerInvariant(), $name
          }
          [IO.File]::WriteAllText("$PWD\checksums-msix.txt", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

      - name: Upload MSIX assets
        uses: actions/upload-artifact@v7
        with:
          name: arbor-msix
          path: ${{ runner.temp }}/msix/
          if-no-files-found: error

  # ── 2b. 署名（Environment msix-signing。main からのデプロイだけ。PR では動かさない） ──────────
  package-signed:
    name: MSIX Package (signed)
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: windows-latest
    environment: msix-signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/package-msix-signed
        with:
          tag: ${{ inputs.tag }}
          pfx-base64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          pfx-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
