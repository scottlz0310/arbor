[package]
name = "arbor"
version = "0.7.0"
edition = "2021"

[lib]
name = "arbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri          = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"
serde          = { version = "1.0.229", features = ["derive"] }
serde_json     = "1.0.154"
toml           = "1.1.8"
git2           = { version = "0.21.0", features = ["ssh", "https"] }
reqwest        = { version = "0.13.5", features = ["json"] }
dirs           = "7.0.0"

# 実行中のコマンドをプロセスツリーごと止めるため（commands/runner.rs）
[target.'cfg(windows)'.dependencies]
windows-sys    = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc           = "0.2.191"

[dev-dependencies]
# ipc/ のコマンドにロジックが紛れ込んでいないことを、ソースの構文木で検査するため（src/ipc/guard.rs）
syn            = { version = "2.0.119", features = ["full", "visit"] }
