[package]
name = "arbor"
version = "0.2.1"
edition = "2021"

[lib]
name = "arbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri          = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.13.3"
serde          = { version = "1.0.229", features = ["derive"] }
serde_json     = "1.0.154"
toml           = "1.1.8"
git2           = { version = "0.21.0", features = ["ssh", "https"] }
reqwest        = { version = "0.13.5", features = ["json"] }
dirs           = "7.0.0"
